<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Producto</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos opcionales -->
    <style>
        body {
            background-color: #f7f8fa;
        }
        .card {
            border-radius: 12px;
        }
    </style>
</head>

<body class="container mt-5">

<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

        <!-- Tarjeta -->
        <div class="card shadow p-4">

            <h3 class="text-center mb-4">Crear Producto</h3>

            <!-- Alertas -->
            <div th:if="${alertMessage}"
                 th:class="'alert alert-' + ${alertType}"
                 role="alert">
                <span th:text="${alertMessage}"></span>
            </div>

            <!-- Formulario -->
            <form th:object="${producto}" th:action="@{/crear-producto}" method="post">

                <input type="hidden" th:field="*{idProducto}" />

                <!-- Campo nombre -->
                <div class="mb-3">
                    <label class="form-label">Nombre del producto</label>
                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           placeholder="Ej: Televisor Samsung"
                           required minlength="3">

                    <!-- Errores -->
                    <div class="text-danger mt-1" th:errors="*{nombre}"></div>
                </div>

                <!-- Campo precio -->
                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number"
                           th:field="*{precio}"
                           class="form-control"
                           placeholder="Ej: 1200000"
                           required min="1" step="0.01">

                    <!-- Errores -->
                    <div class="text-danger mt-1" th:errors="*{precio}"></div>
                </div>

                <!-- Botones -->
                <div class="d-flex justify-content-between mt-3">
                    <a class="btn btn-secondary" th:href="@{/productos}">Volver</a>
                    <button class="btn btn-primary" type="submit">Guardar</button>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
