<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="text-center p-5">
<h1 class="text-danger fw-bold mb-4">😢 Error en la aplicación</h1>
<p class="fs-5 text-secondary" th:text="${alertMessage}">Error interno</p>
<a href="/productos" class="btn btn-primary mt-3">Volver</a>

<script th:if="${alertMessage != null}">
  Swal.fire({
      icon: /*[[${alertType}]]*/ 'error',
      title: 'Error',
      text: '[[${alertMessage}]]',
      confirmButtonText: 'Entendido'
  });
</script>
</body>
</html>
