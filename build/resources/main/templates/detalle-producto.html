<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Producto</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body { background-color: #f3f4f6; }
        .card { border-radius: 15px; }
        .detail-label { font-weight: bold; }

        /* Ícono de ver imagen */
        .view-icon {
            font-size: 35px;
            cursor: pointer;
            color: #0d6efd;
            transition: 0.2s;
        }
        .view-icon:hover {
            transform: scale(1.15);
            color: #0b5ed7;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card mx-auto p-4 shadow" style="max-width: 650px;">

        <h3 class="text-center mb-4">
            <i class="bi bi-file-earmark-text"></i> Detalle del Producto
        </h3>

        <div class="mb-3">
            <span class="detail-label">ID:</span>
            <span th:text="${producto.idProducto}"></span>
        </div>

        <div class="mb-3">
            <span class="detail-label">Nombre:</span>
            <span th:text="${producto.nombre}"></span>
        </div>

        <div class="mb-3">
            <span class="detail-label">Precio:</span>
            <span th:text="${producto.precio}"></span>
        </div>

        <div class="mb-3">
            <span class="detail-label">Fecha de creación:</span>
            <span th:text="${#temporals.format(producto.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span>
        </div>

        <div class="mb-4">
            <span class="detail-label">Categoría:</span>
            <span th:text="${producto.categoria.nombre}"></span>
        </div>

        <!-- Ícono para ver imagen -->
        <div class="mb-4" th:if="${producto.imagenBase64 != null}">
            <span class="detail-label">Imagen:</span>

            <br><br>

            <i class="bi bi-eye-fill view-icon"
               title="Ver imagen"
               data-bs-toggle="modal"
               data-bs-target="#modalImagen"></i>

            <br>
            <small class="text-muted">Haz clic en el ícono para ver la imagen</small>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/productos}" class="btn btn-secondary">Volver</a>
        </div>

    </div>
</div>

<!-- Modal Bootstrap -->
<div class="modal fade" id="modalImagen" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Imagen del Producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center">
                <img th:src="'data:image/*;base64,' + ${producto.imagenBase64}"
                     class="img-fluid rounded shadow">
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
