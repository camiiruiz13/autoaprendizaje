<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Productos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<div class="container mt-5">

    <!-- CABECERA + BOTÓN CREAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">📦 Listado de Productos</h2>

        <a th:href="@{/crear-producto}" class="btn btn-primary shadow-sm">
            <i class="bi bi-plus-circle"></i> Nuevo Producto
        </a>
    </div>

    <div class="card p-4">

        <!-- Si no hay productos -->
        <div th:if="${#lists.isEmpty(productos)}" class="text-center text-muted py-4">
            <h5>No hay productos registrados</h5>
        </div>

        <table th:if="${!#lists.isEmpty(productos)}"
               class="table table-striped align-middle">

            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Fecha de Creación</th>
                <th>Categoría</th> <!-- AGREGADO -->
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="producto : ${productos}">
                <td>
                    <a th:href="@{'/producto/' + ${producto.idProducto}}"
                       class="text-primary text-decoration-underline">
                        <span th:text="${producto.idProducto}"></span>
                    </a>
                </td>

                <td th:text="${producto.nombre}"></td>
                <td th:text="${#numbers.formatDecimal(producto.precio, 1, 2)}"></td>
                <td th:text="${#temporals.format(producto.fechaCreacion, 'dd/MM/yyyy')}"></td>
                <td th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoría'}"></td>

                <td class="d-flex gap-2">
                    <a th:href="@{'/crear-producto/' + ${producto.idProducto}}"
                       class="btn btn-warning btn-sm">
                        <i class="bi bi-pencil-square"></i>
                    </a>

                    <a href="#"
                       th:attr="data-id=${producto.idProducto}"
                       class="btn btn-danger btn-sm btn-delete">
                        <i class="bi bi-trash3-fill"></i>
                    </a>
                </td>
            </tr>
            </tbody>

        </table>


    </div>
</div>


<!-- JS ELIMINACIÓN -->
<script>
    document.addEventListener("DOMContentLoaded", () => {

        document.querySelectorAll(".btn-delete").forEach(btn => {
            btn.addEventListener("click", function (e) {
                e.preventDefault();

                const id = this.getAttribute("data-id");

                if (!id || id === "null" || id === "undefined") {
                    Swal.fire({
                        icon: "error",
                        title: "ID inválido",
                        text: "No se puede eliminar un producto sin ID."
                    });
                    return;
                }

                Swal.fire({
                    title: "¿Eliminar producto?",
                    text: "Esta acción no se puede deshacer.",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#d33",
                    cancelButtonColor: "#3085d6",
                    confirmButtonText: "Sí, eliminar",
                    cancelButtonText: "Cancelar"
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = "/eliminar-producto/" + id;
                    }
                });
            });
        });

    });
</script>


<!-- SWEETALERT: Éxito si viene ?deleted=true -->
<script th:if="${param.deleted != null and #strings.equals(param.deleted, 'true')}">

    const cleanUrl = window.location.origin + window.location.pathname;
    window.history.replaceState({}, document.title, cleanUrl);

    Swal.fire({
        icon: 'success',
        title: 'Producto eliminado',
        text: 'El producto fue eliminado correctamente.',
        confirmButtonColor: '#3085d6'
    });

</script>


</body>
</html>
