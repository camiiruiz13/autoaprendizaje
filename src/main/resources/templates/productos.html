<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Productos</title>

    <!-- Estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center fw-bold mb-4">📦 Listado de Productos</h2>

    <!-- 🧩 Sección de productos -->
    <div th:if="${productos != null}">
        <div class="card p-4">
            <table class="table table-striped align-middle">
                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Fecha de Creación</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.idProducto}"></td>
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${#numbers.formatDecimal(producto.precio,1,2)}"></td>
                    <td th:text="${#dates.format(producto.fechaCreacion, 'dd/MM/yyyy')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 🧱 SweetAlert de alertas -->
<script th:if="${alertMessage != null}">
    Swal.fire({
        icon: /*[[${alertType}]]*/ 'info',
        title: 'Aviso',
        text: '[[${alertMessage}]]',
        confirmButtonText: 'Aceptar',
        confirmButtonColor: '#3085d6'
    });
</script>

</body>
</html>
