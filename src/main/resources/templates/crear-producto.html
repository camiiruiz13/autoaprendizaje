<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar Producto' : 'Crear Producto'"></title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f7f8fa; }
        .card { border-radius: 12px; }
    </style>
</head>

<body class="container mt-5">

<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

        <div class="card shadow p-4">

            <!-- TÍTULO -->
            <h3 class="text-center mb-4"
                th:text="${modoEdicion} ? 'Editar Producto' : 'Crear Producto'"></h3>

            <!-- ALERTAS -->
            <div th:if="${alertMessage}"
                 th:class="'alert alert-' + ${alertType}"
                 role="alert">
                <span th:text="${alertMessage}"></span>
            </div>

            <!-- FORMULARIO -->
            <form th:object="${producto}"
                  th:action="@{/crear-producto}"
                  method="post"
                  enctype="multipart/form-data">

                <!-- ID OCULTO -->
                <input type="hidden" th:field="*{idProducto}"/>

                <!-- NOMBRE -->
                <div class="mb-3">
                    <label class="form-label">Nombre del producto</label>
                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           placeholder="Ej: Televisor Samsung"
                           required minlength="3">
                    <div class="text-danger mt-1" th:errors="*{nombre}"></div>
                </div>

                <!-- PRECIO -->
                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number"
                           th:field="*{precio}"
                           class="form-control"
                           placeholder="Ej: 1200000"
                           required min="1" step="0.01">
                    <div class="text-danger mt-1" th:errors="*{precio}"></div>
                </div>

                <!-- CATEGORIA -->
                <div class="mb-3">
                    <label class="form-label">Categoría</label>

                    <select th:field="*{idCategoria}" class="form-select" required>
                        <option value="">Seleccione una categoría</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.idCategoria}"
                                th:text="${cat.nombre}">
                        </option>
                    </select>

                    <div class="text-danger mt-1" th:errors="*{idCategoria}"></div>
                </div>

                <!-- IMAGEN -->
                <div class="mb-3">
                    <label class="form-label">Imagen del producto</label>

                    <input type="file"
                           name="imagen"
                           class="form-control"
                           accept="image/*">

                    <!-- VALIDACIÓN DE imagenBase64 si falla -->
                    <div class="text-danger mt-1" th:errors="*{imagenBase64}"></div>
                </div>

                <!-- BOTONES -->
                <div class="d-flex justify-content-between mt-3">
                    <a class="btn btn-secondary" th:href="@{/productos}">Volver</a>
                    <button class="btn btn-primary" type="submit"
                            th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'"></button>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
